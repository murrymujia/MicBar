name: iOS simulator
on:
  push:
    branches: ["**"]
    paths: ['ios/**', '.github/workflows/ios.yml', 'app/src/main/assets/pinyin-common.tsv', 'app/src/main/assets/continuations.tsv']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  simulator:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - run: brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
      - name: Build app and keyboard
        working-directory: ios
        run: |
          xcodegen generate
          xcodebuild -scheme MicBar -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
          cd build/Build/Products/Release-iphonesimulator
          for bundle in MicBar.app MicBar.app/PlugIns/MicBarKeyboard.appex; do
            test "$(plutil -extract CFBundleShortVersionString raw "$bundle/Info.plist")" = 0.1.1
          done
          test -f MicBar.app/PlugIns/MicBarKeyboard.appex/continuations.tsv
          test -f MicBar.app/PlugIns/MicBarKeyboard.appex/characters.tsv
          test -f MicBar.app/PlugIns/MicBarKeyboard.appex/pinyin-common.tsv
          ditto -c -k --keepParent MicBar.app MicBar-iOS-Simulator.zip
      - name: Package unsigned iPhone and iPad device build
        working-directory: ios
        run: |
          xcodebuild -scheme MicBar -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/MicBar.app Payload/
          test -x Payload/MicBar.app/PlugIns/MicBarKeyboard.appex/MicBarKeyboard
          /usr/bin/zip -qry MicBar-iOS-0.1.1-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: MicBar-iOS-unsigned-device
          path: ios/MicBar-iOS-0.1.1-unsigned.ipa
      - name: Launch on iPhone
        working-directory: ios
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; print(next(d["udid"] for k,v in json.load(sys.stdin)["devices"].items() if "iOS" in k for d in v if "iPhone" in d["name"]))')
          xcrun simctl boot "$udid" || xcrun simctl bootstatus "$udid" -b
          xcrun simctl bootstatus "$udid" -b
          xcrun simctl install "$udid" build/Build/Products/Release-iphonesimulator/MicBar.app
          xcrun simctl launch "$udid" org.micbar.ios
      - uses: actions/upload-artifact@v4
        with:
          name: MicBar-iOS-Simulator
          path: ios/build/Build/Products/Release-iphonesimulator/MicBar-iOS-Simulator.zip
