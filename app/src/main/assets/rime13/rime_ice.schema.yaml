schema:
  schema_id: rime_ice
  name: 雾凇拼音
  version: "micbar-1.3"
engine:
  processors: [speller, selector, navigator, express_editor]
  segmentors: [ascii_segmentor, abc_segmentor, fallback_segmentor]
  translators: [script_translator, table_translator@melt_eng]
  filters: [uniquifier]
speller:
  alphabet: abcdefghijklmnopqrstuvwxyz
  delimiter: " '"
translator:
  dictionary: rime_ice
  enable_word_completion: true
  enable_user_dict: false
  initial_quality: 1.2
melt_eng:
  dictionary: melt_eng
  enable_user_dict: false
  enable_sentence: false
  initial_quality: 1.1
menu:
  page_size: 6
