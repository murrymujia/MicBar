plugins { id 'com.android.application' version '8.7.3' }
android {
    namespace 'org.micbar.bridge'
    compileSdk 35
    defaultConfig {
        applicationId 'org.micbar.updater'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }
    sourceSets.main.java.srcDir '../updates/src/main/java'
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
